name: Deploy Full Stack App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install and Build Frontend
        run: |
          npm install
          npm run build

      - name: Deploy to VPS
        run: |
          # 1. Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          # 2. Make sure the backend directory exists on the server
          ssh -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p /var/www/byout-backend"

          # 3. Deploy Frontend (dist folder)
          scp -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa -r dist/* ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/var/www/byout
          
          # 4. Deploy Backend (server folder)
          scp -P ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa -r server/* ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/var/www/byout-backend

          # 5. SSH in to configure backend and restart PM2
          ssh -p ${{ secrets.SERVER_PORT }} -i ~/.ssh/id_rsa ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /var/www/byout-backend
            
            # Inject the .env variables securely
            echo "${{ secrets.BACKEND_ENV }}" > .env
            
            # Install backend dependencies
            npm install
            
            # Start or restart the PM2 process
            pm2 restart byout-api || pm2 start index.js --name "byout-api"
            
            # Save the PM2 list so it auto-starts on server reboots
            pm2 save
            pm2 startup | tail -n 1 | bash
          EOF